name: Clinic checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  isolated-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_project.py

  disposable-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: teknocare_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: disposable-ci-settings-only
      DATABASE_URL: postgres://postgres:disposable-ci-only@127.0.0.1:5432/teknocare_ci?sslmode=disable
      DATABASE_SSL_REQUIRE: 'false'
      DEBUG: 'false'
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check --settings=config.settings
      - run: python manage.py makemigrations --check --dry-run --settings=config.settings
      - run: python manage.py test --noinput --settings=config.settings
