{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block main_class %}home-shell{% endblock %}
{% block content %}
  <p><a href="{{ back_href }}">Back</a></p>
  <div class="editor-layout"><header><h1>{{ title }}</h1>{% if description %}<p class="lead">{{ description }}</p>{% endif %}</header>
    <form class="editor-form" method="post">{% csrf_token %}{% include 'includes/form_fields.html' %}
      <div class="page-actions"><button class="button" type="submit">Save</button><a href="{{ back_href }}">Cancel changes</a></div>
    </form>
  </div>
{% endblock %}
