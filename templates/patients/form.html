{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
  <h1>{{ title }}</h1>
  {% if description %}<p class="lead">{{ description }}</p>{% endif %}
  <p><a href="{{ back_href }}">Back</a></p>
  <section class="form-card" aria-label="{{ title }}">
    <form method="post">
      {% csrf_token %}
      {% include 'includes/form_fields.html' %}
      <button class="button" type="submit">Save</button>
    </form>
  </section>
{% endblock %}
