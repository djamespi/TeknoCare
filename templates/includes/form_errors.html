{% if form.errors %}
  <div id="form-errors" class="notice notice-error" role="alert" tabindex="-1">
    <h2 class="error-heading">Please check your details</h2>
    {{ form.non_field_errors }}
    <ul>{% for field in form %}{% for error in field.errors %}<li>{% if field.is_hidden %}{{ field.label }}: {{ error }}{% else %}<a href="#{{ field.id_for_label }}">{{ field.label }}: {{ error }}</a>{% endif %}</li>{% endfor %}{% endfor %}</ul>
  </div>
{% endif %}
