<nav class="sidebar" id="clinic-nav" aria-label="Main navigation">
  {% for group, links in groups %}
    <div class="nav-group"><p>{{ group }}</p>
      {% for route, label, icon in links %}
        {% url route as target %}
        <a href="{{ target }}"{% if current == target %} aria-current="page"{% elif section == route %} aria-current="location"{% endif %}>
          {% include 'includes/icon.html' with name=icon %}{{ label }}
        </a>
      {% endfor %}
    </div>
  {% endfor %}
</nav>
