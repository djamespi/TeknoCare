{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}

  <h1>{{ title }}</h1>
  <p class="lead">{{ description }}</p>
  <p><a href="{% url back_url %}">Back to list</a> &middot; <a href="{% url 'university:management' %}">Clinic setup</a></p>
  <section class="form-card" aria-label="{{ title }}">

  </section>
{% endblock %}
