{% load static %}
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account | TeknoCare</title><link rel="stylesheet" href="{% static 'css/register/register.css' %}"></head>
<body>
<main class="auth-layout"><section class="auth-brand"><p class="eyebrow">TEKNOCARE</p><h1>Your health workspace starts here.</h1><p>Create an account to connect with your university clinic services.</p></section><section class="auth-card"><p class="eyebrow">GET STARTED</p><h2>Create account</h2><form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">Create account</button></form><p class="auth-link">Already registered? <a href="{% url 'login:login' %}">Sign in</a></p></section></main><script src="{% static 'js/register/register.js' %}"></script>
</body></html>
